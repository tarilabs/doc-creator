[project]
name = "doc-creator"
version = "0.1.0"
description = "doc-creator"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "jira-emulator @ git+https://github.com/tarilabs/jira-emulator.git@tarilabs-20260501-remoteLinkAndCustomFieldsImport",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests requiring Claude CLI (deselect with -m 'not llm')",
]
